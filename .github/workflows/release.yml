name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          TAG="v${PACKAGE_VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install development dependencies
        if: steps.version.outputs.exists == 'false'
        run: python -m pip install -e ".[dev]"

      - name: Check package formatting
        if: steps.version.outputs.exists == 'false'
        run: yngfmt --check src

      - name: Lint package source
        if: steps.version.outputs.exists == 'false'
        run: ynglint src

      - name: Run tests
        if: steps.version.outputs.exists == 'false'
        run: pytest

      - name: Run Pyright
        if: steps.version.outputs.exists == 'false'
        run: pyright

      - name: Build distributions
        if: steps.version.outputs.exists == 'false'
        run: python -m build

      - name: Create version tag and GitHub Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --generate-notes

      - name: Keep existing release
        if: steps.version.outputs.exists == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: echo "$RELEASE_TAG already exists; no release created."
