name: Apply yngfmt 0.11.0 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sync canonical style guide
        run: python .github/scripts/apply_yngfmt_011.py

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Apply formatter
        run: yngfmt src tests

      - name: Commit canonicalized repository
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs README.md pyproject.toml
          git commit -m "Apply yngfmt 0.11.0 and sync style guide"
          git push
